
name: Build CPAPAnalyzer iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone
        run: |
          xcodebuild \
            -project CPAPAnalyzer.xcodeproj \
            -scheme CPAPAnalyzer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CPAPAnalyzer.app Payload/
          zip -r CPAPAnalyzer-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CPAPAnalyzer-iPhone
          path: CPAPAnalyzer-unsigned.ipa
